[project]
name = "tablekeeper-dark-factory"
version = "0.1.0"
description = "Autonomous Multi-Agent Dark Factory for Tablekeeper Platform"
requires-python = ">=3.11,<3.14"
dependencies = [
    "band-sdk[langgraph]>=4.0.0",
    "langchain-google-genai>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
